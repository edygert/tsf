[project]
name = "tsf"
version = "0.1.0"
description = "Fast terminal UI to browse and search every tshark / Wireshark display-filter field"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Standard library only on Linux and macOS; Python on Windows lacks curses.
dependencies = ["windows-curses>=2.3; sys_platform == 'win32'"]
keywords = ["tshark", "wireshark", "display-filter", "tui", "curses", "dfir"]
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/edygert/tsf"

[project.scripts]
tsf = "tsf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
